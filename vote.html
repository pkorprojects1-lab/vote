<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote | Outstanding Headteacher &amp; Principal Awards 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; background: #f4faf7; color: #111918; min-height: 100vh; padding: 24px 16px 60px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-weight: 700; color: #0f6e3f; font-size: 18px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e2ede7; border-radius: 16px; padding: 22px; margin-bottom: 16px; }
  h1 { font-size: 22px; line-height: 1.3; margin-bottom: 8px; }
  .muted { color: #5a6e64; font-size: 14px; line-height: 1.5; }
  .opt { display: flex; align-items: center; gap: 12px; border: 1.5px solid #e2ede7; border-radius: 12px; padding: 14px; margin-top: 10px; cursor: pointer; }
  .opt input { accent-color: #0f6e3f; width: 18px; height: 18px; }
  .opt.sel { border-color: #0f6e3f; background: #e6f9f0; }
  .opt .name { font-weight: 600; font-size: 15px; }
  .opt .meta { font-size: 13px; color: #5a6e64; }
  label { display: block; font-size: 12px; font-weight: 600; color: #5a6e64; text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 6px; }
  input[type=tel] { width: 100%; padding: 12px 14px; border: 1.5px solid #e2ede7; border-radius: 10px; font-size: 15px; }
  button { width: 100%; margin-top: 18px; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg,#0f6e3f,#2a9d6e); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { font-size: 14px; margin-top: 12px; min-height: 18px; }
  .err { color: #c62828; }
  .ok { color: #0f6e3f; font-weight: 600; }
  .results .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2ede7; font-size: 15px; }
  .results .row:last-child { border-bottom: none; }
  .badge { display: inline-block; background: #e6f9f0; color: #0f6e3f; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; margin-bottom: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Outstanding Headteacher &amp; Principal Awards 2026</div>

  <div id="loading" class="card muted">Loading poll…</div>

  <div id="notFound" class="card hidden">
    <h1>Poll not found</h1>
    <p class="muted">Check the link you were sent.</p>
  </div>

  <div id="voting" class="hidden">
    <div class="card">
      <span class="badge" id="priceBadge">Each vote costs KSh 15</span>
      <h1 id="title"></h1>
      <p class="muted" id="desc"></p>
      <p class="muted" id="closes" style="margin-top:10px"></p>
    </div>

    <div class="card">
      <div id="options"></div>

      <label for="phone">M-Pesa number</label>
      <input type="tel" id="phone" placeholder="0712345678" inputmode="tel" autocomplete="tel">

      <button id="payBtn" disabled>Pay KSh 15 &amp; vote</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <div id="results" class="card results hidden">
    <h1 id="resultsTitle"></h1>
    <p class="muted" style="margin-bottom:12px">Results</p>
    <div id="resultRows"></div>
  </div>

  <div id="closedNotice" class="card hidden">
    <h1>Voting is closed</h1>
    <p class="muted" id="closedText"></p>
  </div>
</div>

<script>
(function () {
  var pollId = new URLSearchParams(location.search).get('id');
  var poll = null;
  var selected = null;
  var polling = false;

  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function setMsg(text, cls) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }
  function fmt(ms) {
    return new Date(ms).toLocaleString('en-KE', { timeZone: 'Africa/Nairobi', dateStyle: 'medium', timeStyle: 'short' });
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function getJSON(url, opts) {
    return fetch(url, opts).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; });
    });
  }

  function renderOptions() {
    var box = $('options');
    box.innerHTML = '';
    poll.options.forEach(function (o) {
      var row = el('label', 'opt');
      var radio = el('input');
      radio.type = 'radio';
      radio.name = 'option';
      radio.value = o.id;
      radio.addEventListener('change', function () {
        selected = o.id;
        document.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
        row.classList.add('sel');
        $('payBtn').disabled = false;
      });
      var text = el('div');
      text.appendChild(el('div', 'name', o.name));
      var meta = [o.position, o.county].filter(Boolean).join(' · ');
      if (meta) text.appendChild(el('div', 'meta', meta));
      row.appendChild(radio);
      row.appendChild(text);
      box.appendChild(row);
    });
  }

  function loadPoll() {
    if (!pollId) { show('loading', false); show('notFound', true); return; }
    getJSON('/api/polls/' + encodeURIComponent(pollId)).then(function (r) {
      show('loading', false);
      if (!r.ok) { show('notFound', true); return; }
      poll = r.data;
      if (!poll.open) return showResults();
      $('title').textContent = poll.title;
      $('desc').textContent = poll.description || '';
      $('closes').textContent = 'Voting closes ' + fmt(poll.closesAt) + ' (Nairobi time)';
      renderOptions();
      show('voting', true);
    }).catch(function () { show('loading', false); setMsg('Could not load poll.', 'err'); });
  }

  function showResults() {
    getJSON('/api/polls/' + encodeURIComponent(pollId) + '/results').then(function (r) {
      if (r.ok) {
        $('resultsTitle').textContent = r.data.title;
        var rows = $('resultRows');
        rows.innerHTML = '';
        r.data.results.forEach(function (x) {
          var row = el('div', 'row');
          row.appendChild(el('span', '', x.name));
          row.appendChild(el('strong', '', String(x.votes)));
          rows.appendChild(row);
        });
        show('results', true);
      } else {
        $('closedText').textContent = 'Results will be published after voting closes on ' + fmt(poll.closesAt) + '.';
        show('closedNotice', true);
      }
    });
  }

  function pollPayment(ref) {
    polling = true;
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      getJSON('/api/polls/' + encodeURIComponent(pollId) + '/payment/' + encodeURIComponent(ref))
        .then(function (r) {
          if (!r.ok) return;
          if (r.data.status === 'paid') {
            clearInterval(timer);
            polling = false;
            setMsg('Thank you! Your vote has been counted.', 'ok');
            resetForm();
          } else if (r.data.status === 'failed') {
            clearInterval(timer);
            polling = false;
            setMsg('Payment was cancelled or failed. No vote was counted.', 'err');
            $('payBtn').disabled = false;
          }
        }).catch(function () {});
      if (tries >= 40) { // about 2 minutes
        clearInterval(timer);
        polling = false;
        setMsg('Still waiting for M-Pesa confirmation. If you paid, your vote will count shortly.', '');
        $('payBtn').disabled = false;
      }
    }, 3000);
  }

  function resetForm() {
    selected = null;
    document.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
    document.querySelectorAll('input[name=option]').forEach(function (x) { x.checked = false; });
    $('payBtn').disabled = true;
    $('phone').value = '';
  }

  $('payBtn').addEventListener('click', function () {
    var phone = $('phone').value.trim();
    if (selected == null) return setMsg('Choose who you want to vote for.', 'err');
    if (!/^(07|01|254)\d{8,9}$/.test(phone.replace('+', ''))) return setMsg('Enter a valid M-Pesa number (e.g. 0712345678).', 'err');

    var btn = $('payBtn');
    btn.disabled = true;
    setMsg('Sending M-Pesa prompt…');
    getJSON('/api/polls/' + encodeURIComponent(pollId) + '/vote', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ optionId: selected, phone_number: phone })
    }).then(function (r) {
      if (!r.ok) {
        setMsg(r.data.error || 'Could not start payment.', 'err');
        btn.disabled = false;
        return;
      }
      setMsg(r.data.message || 'Check your phone and enter your M-Pesa PIN.');
      pollPayment(r.data.ref);
    }).catch(function () {
      setMsg('Network error. Try again.', 'err');
      btn.disabled = false;
    });
  });

  loadPoll();
})();
</script>
</body>
</html>
